<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новое правило</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#12131A}
a{color:#6EA8FF}a:hover{color:#9CC3FF}
button,input{font-family:inherit}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A3F55 transparent}
</style>
</helmet>
<div role="dialog" aria-labelledby="dlg-h" style="width: 560px; height: 660px; box-sizing: border-box; display: flex; flex-direction: column; background: #12131A; border: 1px solid #2E3244; color: #E8EAF0; font-family: Roboto, 'Segoe UI', system-ui, sans-serif; font-size: 14px; color-scheme: dark; overflow: hidden">

<div style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid #2E3244">
<div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; background: rgba(41,121,255,0.16); color: #6EA8FF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"></path></svg></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<h1 id="dlg-h" style="margin: 0; font-size: 18px; font-weight: 600">Новое правило</h1>
<span style="font-size: 12px; color: #A9AFC2">Когда условие выполнится, бот сделает выбранное действие</span>
</div>
<a href="Rules_Intercepts.dc.html" aria-label="Закрыть" title="Закрыть" style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 6px; color: #A9AFC2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>

<div class="scroll" style="flex: 1; min-height: 0; box-sizing: border-box; padding: 20px 18px 20px 24px; margin-right: 4px; display: flex; flex-direction: column; gap: 16px">

<div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-el" style="font-size: 12px; color: #A9AFC2">Стихия комнаты</label>
<button id="ed-el" aria-haspopup="listbox" style="height: 36px; padding: 0 10px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; gap: 8px; font-size: 14px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B57EE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"></path></svg>Смешанная<svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A90A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-name" style="font-size: 12px; color: #A9AFC2">Название правила</label>
<input id="ed-name" value="Авто-отхил Араджи" style="height: 36px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; font-size: 14px">
</div>
</div>

<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
<span id="ed-trig" style="font-size: 12px; color: #A9AFC2">Триггер</span>
<div role="tablist" aria-labelledby="ed-trig" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 8px; background: #1B1D26; border: 1px solid #2E3244">
<sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3"><button role="tab" aria-selected="{{ tb.sel }}" onClick="{{ tb.pick }}" style="height: 32px; border: 0; border-radius: 6px; background: {{ tb.bg }}; color: {{ tb.color }}; font-size: 13px; font-weight: {{ tb.weight }}; cursor: pointer">{{ tb.label }}</button></sc-for>
</div>
</div>

<sc-if value="{{ isHp }}" hint-placeholder-val="{{ true }}">
<div style="flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-titan" style="font-size: 12px; color: #A9AFC2">Титан</label>
<button id="ed-titan" aria-haspopup="listbox" style="height: 36px; padding: 0 10px 0 5px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; gap: 8px; font-size: 14px"><span role="img" aria-label="Араджи" style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid #F77F00; background: rgba(247,127,0,0.16); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">Ар</span>Араджи<svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A90A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-hp" style="font-size: 12px; color: #A9AFC2">ХП ниже, %</label>
<input id="ed-hp" value="65" style="height: 36px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; font-family: 'Roboto Mono', monospace; font-size: 14px; text-align: center">
</div>
</div>
</sc-if>

<sc-if value="{{ isEnergy }}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-titan2" style="font-size: 12px; color: #A9AFC2">Титан</label>
<button id="ed-titan2" aria-haspopup="listbox" style="height: 36px; padding: 0 10px 0 5px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; gap: 8px; font-size: 14px"><span role="img" aria-label="Ангус" style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid #52B788; background: rgba(82,183,136,0.16); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">Ан</span>Ангус<svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A90A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ed-en" style="font-size: 12px; color: #A9AFC2">Энергия ниже, %</label>
<input id="ed-en" value="30" style="height: 36px; box-sizing: border-box; padding: 0 10px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; font-family: 'Roboto Mono', monospace; font-size: 14px; text-align: center">
</div>
</div>
</sc-if>

<sc-if value="{{ isEnemy }}" hint-placeholder-val="{{ false }}">
<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 12px; color: #A9AFC2">Опасные враги в комнате</span><span style="font-size: 12px; color: #8A90A6">· выбрано: {{ foesCount }}</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ enemies }}" as="e" hint-placeholder-count="13">
<button aria-pressed="{{ e.on }}" onClick="{{ e.toggle }}" style="position: relative; padding: 6px 0; border-radius: 8px; background: {{ e.tile }}; border: 1px solid {{ e.tileBorder }}; color: #E8EAF0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer">
<span style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 6px; border: 1.5px solid {{ e.c }}; background: {{ e.bg }}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ e.i }}</span>
<span style="font-size: 11px; color: #C3C8D6">{{ e.n }}</span>
<sc-if value="{{ e.on }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #3B8E26; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
</button>
</sc-for>
</div>
</div>
</sc-if>

<fieldset style="flex-shrink: 0; margin: 0; padding: 14px 0 0; border: 0; border-top: 1px solid #2E3244; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; float: left; font-size: 13px; font-weight: 600">Действие при срабатывании</legend>
<div style="clear: both; display: flex; align-items: center; gap: 10px"><input type="checkbox" id="act-pause" style="width: 16px; height: 16px; margin: 0; accent-color: #2979FF"><label for="act-pause" style="font-size: 13px">Остановить бота (мягкая пауза)</label></div>
<div style="display: flex; align-items: center; gap: 10px"><input type="checkbox" id="act-skip" style="width: 16px; height: 16px; margin: 0; accent-color: #2979FF"><label for="act-skip" style="font-size: 13px">Запретить вход в комнату (Skip)</label></div>
<button aria-haspopup="dialog" style="height: 36px; padding: 0 10px; border-radius: 6px; background: transparent; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; gap: 8px; font-size: 13px">Требовать обкатку титанов<span style="margin-left: auto; color: #8A90A6">не выбрано</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A90A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</fieldset>

<div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #A9AFC2">Состав для этого правила</span>
<div style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{ editPack }}" as="t" hint-placeholder-count="5"><span role="img" aria-label="{{ t.n }}" title="{{ t.n }}" style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 6px; border: 1.5px solid {{ t.c }}; background: {{ t.bg }}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #E8EAF0">{{ t.i }}</span></sc-for>
<a href="Titan_Picker.dc.html" style="margin-left: auto; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; font-size: 13px; text-decoration: none">Выбрать состав</a>
</div>
</div>

</div>

<div style="flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid #2E3244; background: #1B1D26">
<a href="Rules_Intercepts.dc.html" style="height: 38px; box-sizing: border-box; padding: 0 16px; border-radius: 6px; background: #242734; border: 1px solid #2E3244; color: #E8EAF0; display: flex; align-items: center; font-size: 13px; text-decoration: none">Отмена</a>
<a href="Rules_Intercepts.dc.html" style="height: 38px; box-sizing: border-box; padding: 0 18px; border-radius: 6px; background: #2F7A1E; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"></path></svg>Сохранить правило</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const trig = st.trig || 'hp';
    const foes = st.foes || ['Молох', 'Вулкан'];
    const EL = {
      earth: ['#52B788', 'rgba(82,183,136,0.16)'],
      water: ['#00B4D8', 'rgba(0,180,216,0.16)'],
      fire: ['#F77F00', 'rgba(247,127,0,0.16)'],
      light: ['#E9C46A', 'rgba(233,196,106,0.16)'],
      dark: ['#A3A8C3', 'rgba(163,168,195,0.16)']
    };
    const T = {
      'Ангус': 'earth', 'Авалон': 'earth', 'Эдем': 'earth', 'Сильва': 'earth', 'Вердок': 'earth',
      'Сигурд': 'water', 'Нова': 'water', 'Маири': 'water', 'Гиперион': 'water',
      'Молох': 'fire', 'Вулкан': 'fire', 'Игнис': 'fire', 'Араджи': 'fire',
      'Амон': 'light', 'Люмира': 'light', 'Ригель': 'light', 'Ияри': 'light'
    };
    const pack = (s) => s.split(',').map((n) => {
      const e = EL[T[n]] || EL.dark;
      return { n: n, i: n.slice(0, 2), c: e[0], bg: e[1] };
    });
    const tabs = [['hp', 'По ХП'], ['energy', 'По энергии'], ['enemy', 'По врагам']].map((p) => {
      const sel = trig === p[0];
      return {
        label: p[1], sel: sel,
        bg: sel ? '#1F6FEB' : 'transparent',
        color: sel ? '#FFFFFF' : '#A9AFC2',
        weight: sel ? 500 : 400,
        pick: () => this.setState({ trig: p[0] })
      };
    });
    const names = 'Ангус,Авалон,Эдем,Сильва,Вердок,Сигурд,Гиперион,Нова,Маири,Араджи,Игнис,Вулкан,Молох'.split(',');
    const enemies = names.map((n) => {
      const on = foes.indexOf(n) >= 0;
      const e = EL[T[n]] || EL.dark;
      return {
        n: n, i: n.slice(0, 2), c: e[0], bg: e[1], on: on,
        tile: on ? 'rgba(59,142,38,0.14)' : '#1B1D26',
        tileBorder: on ? '#3B8E26' : '#2E3244',
        toggle: () => {
          const cur = (this.state || {}).foes || ['Молох', 'Вулкан'];
          this.setState({ foes: on ? cur.filter((x) => x !== n) : cur.concat([n]) });
        }
      };
    });
    return {
      tabs: tabs,
      isHp: trig === 'hp',
      isEnergy: trig === 'energy',
      isEnemy: trig === 'enemy',
      enemies: enemies,
      foesCount: foes.length,
      editPack: pack('Сигурд,Араджи,Ригель,Ияри,Люмира')
    };
  }
}
</script>
</body>
</html>
